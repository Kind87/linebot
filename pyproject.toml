[project]
name = "hamburgerking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "line-bot-sdk>=3.25.0",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
hamburgerking = "hamburgerking:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
